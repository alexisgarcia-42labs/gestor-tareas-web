<style>
:root{
  --bg:#f6f6fa; --card:#fff; --border:#e7e7ef; --border-soft:#efeff5;
  --text:#1f2035; --muted:#767890; --faint:#a3a5b8;
  --accent:#6e4fe0; --accent-2:#8b6ff0; --accent-soft:#efeafd; --accent-softer:#f7f4ff;
  --red:#d9435a; --red-soft:#fde8ec; --amber:#d9861a; --amber-soft:#fcf0dc;
  --lila:#7656d6; --lila-soft:#ece6fc; --green:#4f9a72; --green-soft:#e3f2e9;
  --radius:14px; --shadow:0 1px 2px rgba(30,30,60,.04),0 2px 8px rgba(30,30,60,.04);
  --colw:300px; --dayw:36px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Layout */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;letter-spacing:-.02em;padding:4px 4px 16px;white-space:nowrap;min-width:0}
.logo-img{height:46px;width:auto;max-width:100%;aspect-ratio:172/78;border-radius:10px;object-fit:contain;background:#2a1530;flex:none;display:block;box-shadow:0 1px 3px rgba(31,32,53,.18)}
.logo b{color:var(--accent)}
.space{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:12px;background:var(--accent-softer)}
.avatar{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px}
.space strong{display:block;font-size:13px}
.space small{color:var(--muted);font-size:11px}
.space .dot{margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.nav-label{font-size:10.5px;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:12px 10px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;color:#3a3c55;font-size:13.5px}
.nav-item:hover{background:#f4f3fa}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item svg{flex:none;width:17px;height:17px}
.nav-item .count{margin-left:auto;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;font-weight:600;min-width:22px;text-align:center}
.nav-item .count.zero{background:none;color:var(--faint)}
.nav-item .sq{width:9px;height:9px;border-radius:3px;flex:none}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.side-btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 10px;font-size:12.5px;text-align:left;display:flex;gap:8px;align-items:center}
.side-btn:hover{border-color:#d6d1f0;background:var(--accent-softer)}
.side-btn.danger{color:var(--red)}
.notice{font-size:11.5px;color:var(--muted);background:#faf9fd;border:1px dashed #ddd8f2;border-radius:10px;padding:8px 10px;margin-top:4px}

.main{padding:28px 32px 48px;min-width:0}
.top{display:flex;align-items:flex-start;gap:16px}
.top h1{margin:0;font-size:30px;letter-spacing:-.02em}
.top p{margin:6px 0 0;color:var(--muted)}
.top .grow{flex:1}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 13px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#d6d1f0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:10px 16px}
.btn-primary:hover{background:#5f40d2}
.chip-filter{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--accent-soft);color:var(--accent);padding:4px 6px 4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.chip-filter button{border:0;background:none;color:inherit;padding:0 4px;font-size:14px;line-height:1}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin:24px 0 22px;box-shadow:var(--shadow)}
.kpi{display:flex;align-items:center;gap:14px;padding:20px 22px;position:relative}
.kpi+.kpi::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:1px;background:var(--border)}
.kpi-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.kpi-ic svg{width:20px;height:20px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi .num{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .sub{color:var(--muted);font-size:11px;margin-left:6px}
.ring{margin-left:auto}

/* Tabs/toolbar */
.tabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--border)}
.tab{border:0;background:none;padding:10px 12px;color:var(--muted);display:flex;gap:7px;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}
.tab svg{width:16px;height:16px}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.saved{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.toolbar{display:flex;align-items:center;gap:10px;margin:16px 0}
.search{position:relative;width:min(360px,100%)}
.search input{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px 9px 34px;background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.toolbar .grow{flex:1}
select.sel{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px}

.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* Priority tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag svg{width:11px;height:11px}
.p-urgente{--pc:var(--red);--ps:var(--red-soft)}
.p-alta{--pc:var(--amber);--ps:var(--amber-soft)}
.p-media{--pc:var(--lila);--ps:var(--lila-soft)}
.p-baja{--pc:var(--green);--ps:var(--green-soft)}
.tag{color:var(--pc);background:var(--ps)}
.list-name{font-size:11px;color:var(--muted)}
.gmail-link{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:2px 6px;background:#fce8e6;color:#c5221f;text-decoration:none;line-height:1;vertical-align:middle;flex:none}
.gmail-link svg{width:12px;height:12px}
.gmail-link:hover{background:#f9d2ce}
.lst-row .tline{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px}
.late-chip{font-size:10.5px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:6px;padding:2px 6px}
/* Subtareas y plazo fatal */
.sub-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;color:#4a4c66;background:#eeedf5}
.sub-chip.all-done{color:var(--green);background:var(--green-soft)}
.fatal-chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap;color:var(--red);background:var(--red-soft);border:1px solid #f5c2cc}
.fatal-chip.over{color:#fff;background:#b3122e;border-color:#b3122e}
.tl-fatal{position:absolute;top:3px;transform:translateX(-50%);color:var(--red);font-size:13px;line-height:1;z-index:4;background:#fff;border-radius:4px;padding:1px 2px;cursor:help;user-select:none;-webkit-user-select:none}
.tl-fatal.over{color:#fff;background:#b3122e}
.tl-fatal.edge{transform:none;font-size:11.5px;font-weight:700;border:1px solid #f5c2cc;padding:1px 4px}
.tl-row.fatal-over .tl-left{background:#fff1f3;box-shadow:inset 4px 0 0 #b3122e}
.tl-row.fatal-over:hover .tl-left{background:#ffe8ec}
.lst-row.fatal-over{background:#fff5f6}
.card.fatal-over{border-color:#e48a9a;background:#fff8f9}
.subs{gap:8px}
.subs-head{display:flex;align-items:center;gap:8px}
.subs-list{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:9px}
.sub-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--border-soft)}
.sub-item:last-child{border-bottom:0}
.sub-item .sub-title{flex:1;min-width:0;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-size:13px;color:var(--text);background:none}
.sub-item .sub-title:hover{border-color:var(--border)}
.sub-item .sub-title:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.sub-item.done .sub-title{text-decoration:line-through;color:var(--muted)}
.sub-del{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;width:26px;height:26px;border-radius:6px}
.sub-del:hover{background:var(--red-soft);color:var(--red)}
.sub-empty{padding:8px 10px;color:var(--faint);font-size:12px}
.field input.sub-new{border-style:dashed}

/* Timeline */
.tl-toolbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.zoom-custom{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.zoom-custom input{border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:12px;background:#fff;color:var(--text)}
.zoom-custom .btn{padding:4px 10px;font-size:12px}
.zoom-err{color:var(--red);font-size:11.5px}
.tl-frame.wide .tl-day{font-size:11.5px}
.tl-frame.wide .tl-day b{font-size:14px}
.tl-toolbar .grow{flex:1}
.tl-count{font-size:12px;color:var(--muted)}
.icon-btn{border:1px solid transparent;background:none;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;color:#55576f}
.icon-btn:hover{background:#f3f2f9}
#btn-today{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 12px;font-size:13px}
#btn-today.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.range-text{font-size:12.5px;color:var(--muted);min-width:110px;text-align:center}
.tl-frame{position:relative}
.tl-scroll{overflow:auto;max-height:calc(100vh - 140px);border-radius:0 0 var(--radius) var(--radius)}
.tl-inner{position:relative;min-width:100%}
.tl-head{display:flex;position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--border)}
.tl-left{position:sticky;left:0;z-index:4;background:#fff;width:var(--colw);flex:none;border-right:1px solid var(--border);padding:12px 16px}
.tl-head .tl-left{z-index:7;font-size:12px;color:var(--muted);display:flex;align-items:flex-end;padding-bottom:10px}
.tl-days{display:flex}
.tl-day{width:var(--dayw);flex:none;text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0;border-right:1px solid var(--border-soft)}
.tl-day b{display:block;font-size:12.5px;color:#41435c;font-weight:500;margin-top:2px}
.tl-day .mon{display:block;font-size:9px;color:var(--accent);font-weight:700;text-transform:uppercase;height:11px}
.tl-day.we{background:#fafafc}
.tl-day.today{background:var(--accent-soft);color:var(--accent)}
.tl-day.today b{color:var(--accent);font-weight:700}
.tl-body{position:relative}
.tl-grid{position:absolute;top:0;bottom:0;left:var(--colw);display:flex;pointer-events:none;z-index:0}
.tl-gcol{width:var(--dayw);flex:none;border-right:1px solid var(--border-soft)}
.tl-gcol.we{background:#f8f8fb}
.tl-gcol.today{background:rgba(118,86,214,.06);position:relative}
.tl-gcol.today::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--accent-2);opacity:.75}
.tl-row{display:flex;border-bottom:1px solid var(--border-soft);position:relative;z-index:1}
.tl-row:hover .tl-left{background:#fcfbff}
.tl-row.late .tl-left{box-shadow:inset 3px 0 0 var(--red)}
.tl-title{display:block;border:0;background:none;padding:0;text-align:left;font-size:13px;font-weight:500;color:var(--text);white-space:normal;overflow-wrap:anywhere;word-break:break-word;text-overflow:clip;overflow:visible;width:100%}
.tl-title:hover{color:var(--accent)}
.tl-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.tl-track{position:relative;flex:none;min-height:54px}
.tl-bar{position:absolute;top:50%;transform:translateY(-50%);height:26px;border-radius:7px;background:var(--ps);border:1px solid color-mix(in srgb,var(--pc) 40%,transparent);color:var(--pc);font-size:11px;display:flex;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;z-index:2;overflow:hidden}
.tl-bar:hover{box-shadow:0 2px 8px rgba(60,40,140,.15)}
.tl-bar.dragging{cursor:grabbing;box-shadow:0 4px 14px rgba(60,40,140,.25);z-index:5;opacity:.95}
.tl-bar.late{border:2px solid var(--red)}
.tl-bar.clip-l{border-top-left-radius:0;border-bottom-left-radius:0;border-left-style:dashed}
.tl-bar.clip-r{border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:dashed}
.tl-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;pointer-events:none}
.tl-bar.narrow{justify-content:space-between}
.tl-bar.narrow .tl-label{display:none}
.tl-handle-start,.tl-handle-end{flex:none;width:9px;align-self:stretch;cursor:ew-resize;position:relative;touch-action:none}
.tl-handle-start::after,.tl-handle-end::after{content:"";position:absolute;top:6px;bottom:6px;left:3px;width:3px;border-radius:2px;background:var(--pc);opacity:.55}
.tl-handle-start:hover::after,.tl-handle-end:hover::after{opacity:1}
.tl-bar.late-pin{background:var(--red-soft);color:var(--red);--pc:var(--red);font-weight:600}
.tl-outlabel{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;color:var(--pc);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:1}
.tl-bar.dragging~.tl-outlabel{display:none}
.tl-drag-hint{position:fixed;z-index:50;background:#1f2035;color:#fff;font-size:11.5px;border-radius:6px;padding:4px 8px;pointer-events:none;white-space:nowrap}
.tl-section{position:relative;z-index:1;background:#fbfaff;border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
.tl-section .tl-left{background:#fbfaff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 16px}
.tl-row.nodue .tl-track{min-height:46px}
.nodue-hint{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--faint);white-space:nowrap}
#tl-col-resizer{position:absolute;top:0;bottom:0;left:calc(var(--colw) - 4px);width:8px;cursor:col-resize;z-index:9;touch-action:none}
#tl-col-resizer::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
#tl-col-resizer:hover::after,#tl-col-resizer.active::after,#tl-col-resizer:focus-visible::after{background:var(--accent-2)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* List */
.lst-sec{padding:12px 18px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:#fbfaff}
.lst-sec:first-child{border-radius:var(--radius) var(--radius) 0 0}
.lst-sec button{margin-left:auto;font-size:11.5px;text-transform:none;letter-spacing:0;font-weight:500;border:0;background:none;color:var(--accent)}
.lst-row{display:grid;grid-template-columns:28px minmax(0,1fr) 130px 110px 110px;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--border-soft)}
.lst-row:hover{background:#fcfbff}
.lst-row .t{border:0;background:none;padding:0;text-align:left;font-weight:500;overflow-wrap:anywhere}
.lst-row .t:hover{color:var(--accent)}
.lst-row.done .t{color:var(--muted);text-decoration:line-through}
.lst-row .n{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.lst-row select{border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:12px;background:#fff}
.due{font-size:12px;color:#4a4c66}
.due.late{color:var(--red);font-weight:600}
.due.today{color:var(--accent);font-weight:600}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}

/* Board */
.board-bar{display:flex;gap:6px;margin-bottom:12px}
.seg{display:inline-flex;background:#f0eff6;border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--text);box-shadow:var(--shadow);font-weight:600}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:#f1f0f7;border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{margin:2px 4px 4px;font-size:12.5px;display:flex;align-items:center;gap:8px}
.col h3 .c{color:var(--muted);font-weight:500}
.card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:#d6d1f0}
.card .t{font-weight:500;font-size:13px;overflow-wrap:anywhere;display:block;border:0;background:none;padding:0;text-align:left;width:100%;cursor:pointer}
.card .t:hover{color:var(--accent)}
.card.done .t{text-decoration:line-through;color:var(--muted)}
.card .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.card.late{border-left:3px solid var(--red)}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(25,22,50,.35);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 60px rgba(20,10,60,.25)}
.modal header{display:flex;align-items:center;padding:18px 22px 6px}
.modal header h2{margin:0;font-size:17px}
.modal header .icon-btn{margin-left:auto}
.modal form{padding:8px 22px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:13.5px;color:var(--text);background:#fff}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.modal .actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:4px}
.modal .actions .grow{flex:1}
.gl-link{color:var(--accent);font-size:13px;text-decoration:none;font-weight:600}
.gl-link:hover{text-decoration:underline}
.form-note{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.err{grid-column:1/-1;color:var(--red);font-size:12px}
/* Responsable y sincronización con GitHub (cambio 7) */
.repeat-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;color:#5a3fc0;background:#eeeafc}
/* Bloque de repetición estilo Google Tasks */
.rep-box{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0}
.rep-box legend{padding:0 4px}
.rep-body{display:flex;flex-direction:column;gap:9px}
.rep-body[hidden]{display:none}
.rep-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rep-row[hidden]{display:none}
.field.rep-box input[type=number]{width:72px}
.field.rep-box input[type=radio]{width:auto;margin:0;accent-color:var(--accent)}
.rep-days{display:flex;flex-wrap:wrap;gap:5px}
.rep-day{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted)}
.rep-day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.rep-day:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.rep-end{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.rep-end legend{padding:0;margin-bottom:4px}
.rep-end label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--text);font-size:13px}
.resp-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;color:#2f6f8f;background:#e4f1f7}
.saved.error{color:var(--red);font-weight:600}
.saved.error .dot{background:var(--red)}
.saved.syncing .dot{background:var(--amber)}
.gh-reload{border:1px solid var(--border);background:#fff;border-radius:8px;padding:3px 8px;font-size:11.5px;color:var(--accent)}
.gh-reload:hover{border-color:#d6d1f0;background:var(--accent-softer)}
.side-btn.gh-on{color:var(--green)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2035;color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2)}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .main{padding:20px 16px}
  .lst-row{grid-template-columns:28px minmax(0,1fr) 100px}
  .lst-row .hide-sm{display:none}
}
/* Keep controls and workflow fields readable on narrow screens, without clipping. */
@media (max-width:600px){
  .app{grid-template-columns:minmax(0,1fr)}
  .top,.tabs,.toolbar{flex-wrap:wrap}
  .top .grow{flex-basis:100%;min-width:0}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .kpi{min-width:0}
  .kpi+.kpi::before{top:0;bottom:auto;left:20px;right:20px;width:auto;height:1px}
  .saved{flex-basis:100%;margin:8px 0;flex-wrap:wrap}
  .toolbar label{flex:1 1 145px;min-width:0}
  .toolbar .search{flex-basis:100%;width:100%}
  .toolbar .grow{flex-basis:100%;height:0}
  .toolbar select{width:100%;max-width:100%}
  .modal form{grid-template-columns:minmax(0,1fr)}
  .field{min-width:0}
  .field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%}
  .field .rep-row select,.field .rep-end input[type=date]{width:auto;flex:1 1 140px}
  .modal .actions{flex-wrap:wrap}
  .form-note,.notice{overflow-wrap:anywhere}
  .toast{max-width:calc(100vw - 32px);overflow-wrap:anywhere}
}
</style>

/* Migración única del cambio 5: la tarea que mezcla "conversar con trabajadores que se moverán"

   laboral -> Payroll) se divide en dos. Corre solo si el estado no trae la bandera splitDJ5.

/* ---------- Timeline ---------- */
var DAYW=36;
function rangeLen(){return UI.zoom==='custom'&&UI.custom?dn(UI.custom.to)-dn(UI.custom.from)+1:ZOOMS[UI.zoom].len;}
/* Inicio por defecto de cada zoom: 3 días = ayer..mañana; Semana = lunes a domingo; Mes = hoy-3 (como antes) */
function defaultStart(z,TD){if(z==='3d')return TD-1;if(z==='week')return TD-((wd(TD)+6)%7);if(z==='custom'&&UI.custom)return dn(UI.custom.from);return TD-3;}
function syncCustom(){if(UI.zoom==='custom')UI.custom={from:fromDn(UI.rangeStart),to:fromDn(UI.rangeStart+DAYS-1)};}
function computeDayW(){
  var main=document.getElementById('view'),w=(main.clientWidth||1100)-2-UI.colw;
  DAYW=Math.max(ZOOMS[UI.zoom].min,Math.floor(w/DAYS));
}
function geom(s,d){
  var R0=UI.rangeStart,a=s-R0,b=d-R0;
  if(b<0)return {left:2,width:Math.min(DAYS,4)*DAYW-4,before:true,clipL:true,clipR:false};
  if(a>DAYS-1)return {left:Math.max(0,DAYS-3)*DAYW+2,width:Math.min(DAYS,3)*DAYW-4,after:true,clipL:false,clipR:true};
  var l=Math.max(a,0),r=Math.min(b,DAYS-1);
  return {left:l*DAYW+2,width:(r-l+1)*DAYW-4,clipL:a<0,clipR:b>DAYS-1};
}
function barHtml(t){
  var s=dn(effStart(t)),d=dn(t.due),g=geom(s,d),late=isLate(t);
  var cls='tl-bar '+prioClass(t.priority)+(late?' late':'')+(g.clipL?' clip-l':'')+(g.clipR?' clip-r':'')+(g.before?' late-pin':'')+(g.width<44?' narrow':'');
  var label=g.before?'◂ atrasada · venció '+fmt(t.due):g.after?'inicia '+fmt(effStart(t))+' ▸':t.title;
  var tip=t.title+' — '+(t.start&&t.start!==t.due?fmt(t.start)+' → ':'')+fmt(t.due,true)+(late?' (atrasada)':'');
  return '<div class="'+cls+'" data-task-id="'+esc(t.id)+'" tabindex="0" role="button" aria-label="'+esc(tip)+'. Arrastra para cambiar fechas" title="'+esc(tip)+'" style="left:'+g.left+'px;width:'+g.width+'px">'+
    (!g.clipL&&!g.after?'<span class="tl-handle-start" aria-hidden="true"></span>':'')+
    '<span class="tl-label">'+esc(label)+'</span>'+
    (!g.clipR&&!g.before?'<span class="tl-handle-end" aria-hidden="true"></span>':'')+'</div>'+
    /* Si el título no cabe en la barra (aprox. 6.3px por carácter), se muestra completo a su derecha */
    (!g.before&&!g.after&&t.title.length*6.3+20>g.width&&g.left+g.width+150<DAYS*DAYW?'<span class="tl-outlabel '+prioClass(t.priority)+'" style="left:'+(g.left+g.width+6)+'px;max-width:'+Math.max(150,Math.min(420,DAYS*DAYW-(g.left+g.width+12)))+'px">'+esc(t.title)+'</span>':'');
}
/* Marcador del plazo fatal en la fila: rombo en su fecha o indicador en el borde si cae fuera del rango */
function fatalMarker(t){
  if(!t.fatal)return '';
  var f=dn(t.fatal)-UI.rangeStart,over=isFatalOver(t),tip='Plazo fatal: '+fmtDMY(t.fatal)+(over?' (vencido)':'');
  var cls='tl-fatal'+(over?' over':'');
  if(f<0)return '<span class="'+cls+' edge" data-edge="left" style="left:2px" title="'+tip+' · antes del rango visible" aria-label="'+tip+'">◂ ⚑</span>';
  if(f>DAYS-1)return '<span class="'+cls+' edge" data-edge="right" style="right:2px" title="'+tip+' · después del rango visible" aria-label="'+tip+'">⚑ ▸</span>';
  return '<span class="'+cls+'" data-date="'+t.fatal+'" style="left:'+(f*DAYW+DAYW/2)+'px" title="'+tip+'" aria-label="'+tip+'">◆</span>';
}
function leftHtml(t){
  return '<div class="tl-left"><button type="button" class="tl-title" data-open="'+esc(t.id)+'">'+esc(t.title)+'</button><div class="tl-meta">'+prioTag(t.priority)+'<span class="list-name">'+esc(listTitle(t.listId))+'</span>'+gmailChip(t)+subChip(t)+fatalChip(t)+respChip(t)+repeatChip(t)+workflowChip(t)+(isLate(t)?'<span class="late-chip">Atrasada · '+esc(fmt(t.due))+'</span>':'')+'</div></div>';
}
var ZOOM_LABELS=[['3d','3 días'],['week','Semana'],['month','Mes'],['custom','Personalizado']];
function renderTimeline(el){
  var td=T(),TD=dn(td);
  DAYS=rangeLen();
  if(UI.rangeStart==null)UI.rangeStart=defaultStart(UI.zoom,TD);
  var R0=UI.rangeStart,R1=R0+DAYS-1;
  computeDayW();
  var wide=DAYW>=90;
  var items=filtered().filter(isOpen).sort(cmp);
  if(UI.todayOnly)items=items.filter(function(t){return isActionToday(t,td);});
  var rows=items.filter(function(t){return t.due;}),undated=items.filter(function(t){return !t.due;});
  var shown=rows.length+undated.length;
  var h='<div class="panel"><div class="tl-toolbar">'+
    '<span class="tl-count" id="tl-count">'+(UI.todayOnly?'Mostrando '+shown+' acciones y alertas para hoy':shown+' pendientes')+'</span>'+
    '<div class="seg" role="group" aria-label="Zoom del timeline">'+ZOOM_LABELS.map(function(z){return '<button type="button" data-zoom="'+z[0]+'" aria-pressed="'+(UI.zoom===z[0])+'">'+z[1]+'</button>';}).join('')+'</div>';
  if(UI.zoom==='custom'){
    h+='<span class="zoom-custom"><label>Desde <input type="date" id="zoom-from" value="'+fromDn(R0)+'"></label><label>Hasta <input type="date" id="zoom-to" value="'+fromDn(R1)+'"></label>'+
      '<button type="button" class="btn" data-action="zoom-apply" id="zoom-apply">Aplicar</button><span class="zoom-err" id="zoom-err" role="alert"></span></span>';
  }
  h+='<span class="grow"></span>'+
    '<button type="button" class="icon-btn" id="tl-prev" data-action="prev" aria-label="Rango anterior ('+DAYS+' días)">‹</button>'+
    '<button type="button" id="btn-today" data-action="today" class="'+(UI.todayOnly?'active':'')+'" aria-pressed="'+UI.todayOnly+'" title="Mostrar acciones de hoy, seguimientos pendientes y alertas de plazo fatal">Hoy</button>'+
    '<span class="range-text" id="tl-range" data-from="'+fromDn(R0)+'" data-to="'+fromDn(R1)+'">'+fmt(fromDn(R0))+' — '+fmt(fromDn(R1))+'</span>'+
    '<button type="button" class="icon-btn" id="tl-next" data-action="next" aria-label="Rango siguiente ('+DAYS+' días)">›</button></div>';
  h+='<div class="tl-frame'+(wide?' wide':'')+'" id="tl-frame" data-zoom="'+UI.zoom+'" style="--colw:'+UI.colw+'px;--dayw:'+DAYW+'px"><div class="tl-scroll" id="tl-scroll"><div class="tl-inner" style="width:'+(UI.colw+DAYS*DAYW)+'px">';
  var head='',grid='';
  for(var n=R0;n<=R1;n++){
    var w=wd(n),we=(w===0||w===6),p=fromDn(n).split('-'),isT=n===TD;
    var mon=(wide||n===R0||p[2]==='01')?MES[+p[1]-1]+(wide&&(n===R0||p[2]==='01')?' '+p[0]:''):'';
    head+='<div class="tl-day'+(we?' we':'')+(isT?' today':'')+'" data-date="'+fromDn(n)+'"><span class="mon">'+mon+'</span>'+DOW[w]+'<b>'+(+p[2])+'</b></div>';
    grid+='<div class="tl-gcol'+(we?' we':'')+(isT?' today':'')+'"></div>';
  }
  h+='<div class="tl-head"><div class="tl-left">Plan y plazo</div><div class="tl-days">'+head+'</div></div>';
  h+='<div class="tl-body" id="tl-body"><div class="tl-grid" aria-hidden="true">'+grid+'</div>';
  rows.forEach(function(t){
    h+='<div class="tl-row'+(isLate(t)?' late':'')+(isFatalOver(t)?' fatal-over':'')+'" data-task-id="'+esc(t.id)+'" data-start="'+esc(effStart(t))+'" data-due="'+esc(t.due)+'">'+leftHtml(t)+'<div class="tl-track" style="width:'+DAYS*DAYW+'px">'+barHtml(t)+fatalMarker(t)+'</div></div>';
  });
  if(!rows.length)h+='<div class="tl-row"><div class="tl-left empty" style="padding:24px 16px">'+(UI.todayOnly?'No hay acciones con plazo para hoy.':'No hay tareas pendientes con plazo.')+'</div><div class="tl-track" style="width:'+DAYS*DAYW+'px"></div></div>';
  if(undated.length){
    h+='<div class="tl-section"><div class="tl-left">Sin plazo · '+undated.length+'</div></div>';
    undated.forEach(function(t){h+='<div class="tl-row nodue'+(isFatalOver(t)?' fatal-over':'')+'" data-task-id="'+esc(t.id)+'">'+leftHtml(t)+'<div class="tl-track" style="width:'+DAYS*DAYW+'px"><span class="nodue-hint">Asigna un plazo para verla en el timeline</span>'+fatalMarker(t)+'</div></div>';});
  }
  h+='</div></div></div><div id="tl-col-resizer" role="separator" aria-orientation="vertical" aria-label="Ajustar ancho de la columna Plan y plazo" aria-valuenow="'+UI.colw+'" aria-valuemin="180" aria-valuemax="720" tabindex="0"></div></div></div>';
  var sc=document.getElementById('tl-scroll'),keep=sc?{top:sc.scrollTop,left:sc.scrollLeft}:null;
  el.innerHTML=h;
  if(keep){var ns=document.getElementById('tl-scroll');ns.scrollTop=keep.top;ns.scrollLeft=keep.left;}
}
function centerToday(){
  var sc=document.getElementById('tl-scroll');if(!sc)return;
  var idx=dn(T())-UI.rangeStart,x=idx*DAYW+DAYW/2,vis=sc.clientWidth-UI.colw;
  sc.scrollLeft=Math.max(0,x-vis/2);
}
function setZoom(z){
  var TD=dn(T());
  if(z==='custom'){
    if(!UI.custom){var len=Math.min(rangeLen(),MAX_CUSTOM);UI.custom={from:fromDn(UI.rangeStart),to:fromDn(UI.rangeStart+len-1)};}
    UI.zoom='custom';UI.rangeStart=dn(UI.custom.from);
  }else{
    UI.zoom=z;DAYS=ZOOMS[z].len;
    UI.rangeStart=UI.todayOnly?TD-Math.floor((DAYS-1)/2):defaultStart(z,TD);
  }
  saveUI();renderView();
  var sc=document.getElementById('tl-scroll');if(sc)sc.scrollLeft=0;
  if(UI.todayOnly)centerToday();

function applyCustom(){
  var f=document.getElementById('zoom-from').value,t=document.getElementById('zoom-to').value,err=document.getElementById('zoom-err');
  if(!dateOnly(f)||!dateOnly(t)){err.textContent='Indica ambas fechas.';return;}
  var n=dn(t)-dn(f)+1;
  if(n<1){err.textContent='"Desde" debe ser anterior o igual a "Hasta".';return;}
  if(n>MAX_CUSTOM){err.textContent='Máximo '+MAX_CUSTOM+' días.';return;}
  UI.custom={from:f,to:t};UI.rangeStart=dn(f);saveUI();renderView();
  var sc=document.getElementById('tl-scroll');if(sc)sc.scrollLeft=0;
}
function shiftRange(dir){UI.rangeStart+=dir*DAYS;syncCustom();saveUI();renderView();}

/* Arrastre de barras (Pointer Events: mouse, trackpad, touch) */
var drag=null,hint=null;
function showHint(x,y,txt){if(!hint){hint=document.createElement('div');hint.className='tl-drag-hint';document.body.appendChild(hint);}hint.textContent=txt;hint.style.left=(x+14)+'px';hint.style.top=(y-30)+'px';}
function hideHint(){if(hint){hint.remove();hint=null;}}
document.addEventListener('pointerdown',function(e){
  var rz=e.target.closest&&e.target.closest('#tl-col-resizer');
  if(rz){
    e.preventDefault();rz.setPointerCapture(e.pointerId);rz.classList.add('active');
    drag={kind:'col',el:rz,x0:e.clientX,w0:UI.colw,pid:e.pointerId};return;
  }
  var bar=e.target.closest&&e.target.closest('.tl-bar');
  if(!bar||(e.pointerType==='mouse'&&e.button!==0))return;
  var t=getTask(bar.getAttribute('data-task-id'));if(!t||!t.due)return;
  var mode=e.target.closest('.tl-handle-start')?'start':e.target.closest('.tl-handle-end')?'end':'move';
  var s0=dn(effStart(t)),d0=dn(t.due);
  drag={kind:'bar',el:bar,id:t.id,mode:mode,x0:e.clientX,s0:s0,d0:d0,ns:s0,nd:d0,moved:false,pid:e.pointerId};
  bar.setPointerCapture(e.pointerId);e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  var dx=e.clientX-drag.x0;
  if(drag.kind==='col'){
    UI.colw=clamp(Math.round(drag.w0+dx),180,720);
    document.getElementById('tl-frame').style.setProperty('--colw',UI.colw+'px');
    var inner=document.querySelector('.tl-inner');if(inner)inner.style.width=(UI.colw+DAYS*DAYW)+'px';
    var gr=document.querySelector('.tl-grid');if(gr)gr.style.left=UI.colw+'px';
    return;
  }
  if(Math.abs(dx)>3)drag.moved=true;
  if(!drag.moved)return;
  var k=Math.round(dx/DAYW),s=drag.s0,d=drag.d0;
  if(drag.mode==='start')s=Math.min(drag.s0+k,drag.d0);
  else if(drag.mode==='end')d=Math.max(drag.d0+k,drag.s0);
  else{s=drag.s0+k;d=drag.d0+k;}
  drag.ns=s;drag.nd=d;
  var g=geom(s,d);drag.el.style.left=g.left+'px';drag.el.style.width=g.width+'px';drag.el.classList.add('dragging');
  showHint(e.clientX,e.clientY,(drag.mode==='end'?'Plazo: ':drag.mode==='start'?'Inicio: ':'')+fmt(fromDn(s))+(s!==d?' → '+fmt(fromDn(d)):''));
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid)return;
  var d=drag;drag=null;hideHint();
  try{d.el.releasePointerCapture(e.pointerId);}catch(_){}
  if(d.kind==='col'){d.el.classList.remove('active');saveUI();renderView();return;}
  if(cancel){renderView();return;}
  if(!d.moved){openModal(d.id);return;}
  if(d.ns!==d.s0||d.nd!==d.d0){
    var t=getTask(d.id);t.start=fromDn(d.ns);t.due=fromDn(d.nd);touch(t);persist();
    render();toast('Fechas actualizadas: '+fmt(t.start)+(t.start!==t.due?' → '+fmt(t.due):''));
  }else renderView();
}
document.addEventListener('pointerup',function(e){endDrag(e,false);});
document.addEventListener('pointercancel',function(e){endDrag(e,true);});

/* ---------- eventos ---------- */
/* El enlace de Gmail navega por sí mismo (pestaña nueva): no debe abrir el modal ni iniciar arrastres. */

document.addEventListener('click',function(e){

  }

document.addEventListener('change',function(e){

function setStatus(t,st){
  var was=t.status;t.status=st;t.completed=st==='completed'?new Date().toISOString():null;touch(t);
  var info={},n=st==='completed'&&was!=='completed'?spawnNext(t,info):null;
  if(n)setTimeout(function(){toast('🔁 Siguiente repetición creada: '+fmt(n.due,true));},0); // después del toast de guardado
  else if(info.ended)setTimeout(function(){toast('🔁 Serie terminada: no se crea otra ocurrencia ('+info.ended+')');},0);
  return n;
}
function exportJson(){
  var data=JSON.stringify({version:4,schemaVersion:4,migrations:S.migrations||{projects4:true,splitDJ5:true},exportedAt:new Date().toISOString(),source:'Tasks. (local)',lists:S.lists,tasks:S.tasks,deleted:S.deleted||{}},null,2);

  var a=document.createElement('a');a.href=url;a.download='tasks-web-'+T()+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('Exportado '+S.tasks.length+' tareas');
}

/* Formulario de repetición (estilo Google Tasks): frecuencia, cada N, días, día del mes, comienza y finaliza */
var REP_UNITS={daily:'día(s)',weekly:'semana(s)',monthly:'mes(es)'},WD_FULL=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
function repeatFormHtml(t){
  var r=normRepeatRule(t.repeat,t.repeatRule)||{},rep=REPEATS.hasOwnProperty(t.repeat)?t.repeat:'',end=r.endType||'never';
  var md='<option value="">Mismo día del plazo</option>';for(var d=1;d<=31;d++)md+='<option value="'+d+'"'+(r.monthDay===d?' selected':'')+'>'+d+'</option>';
  md+='<option value="last"'+(r.monthDay==='last'?' selected':'')+'>Último día</option>';
  var radio=function(v,label){return '<input type="radio" name="repEnd" value="'+v+'"'+(end===v?' checked':'')+'> '+label;};
  return '<fieldset class="field full rep-box" id="m-rep"><legend>Repetir</legend>'+
    '<label class="rep-row"><span class="sr-only">Frecuencia</span><select name="repeat"><option value="">No se repite</option>'+Object.keys(REPEATS).map(function(k){return '<option value="'+k+'"'+(k===rep?' selected':'')+'>'+REPEATS[k]+'</option>';}).join('')+'</select></label>'+
    '<div class="rep-body" id="m-rep-body"'+(rep?'':' hidden')+'>'+
    '<div class="rep-row"><label for="m-rep-int">Se repite cada</label><input type="number" id="m-rep-int" name="repInterval" min="1" step="1" inputmode="numeric" value="'+(r.interval||1)+'"><span id="m-rep-unit">'+(REP_UNITS[rep]||'')+'</span></div>'+
    '<div class="rep-row" id="m-rep-week"'+(rep==='weekly'?'':' hidden')+'><span id="m-rep-week-l">Días</span><div class="rep-days" role="group" aria-labelledby="m-rep-week-l">'+
      'LMMJVSD'.split('').map(function(c,i){var on=(r.weekdays||[]).indexOf(i+1)>=0;return '<button type="button" class="rep-day" data-wd="'+(i+1)+'" aria-pressed="'+on+'" aria-label="'+WD_FULL[i]+'" title="'+WD_FULL[i]+'">'+c+'</button>';}).join('')+'</div></div>'+
    '<label class="rep-row" id="m-rep-month"'+(rep==='monthly'?'':' hidden')+'>Día del mes<select name="repMonthDay">'+md+'</select></label>'+
    '<label class="rep-row">Comienza<input type="date" name="repStart" data-had="'+(r.start?1:0)+'" value="'+esc(r.start||t.due||T())+'"></label>'+
    '<fieldset class="rep-end"><legend>Finaliza</legend>'+
      '<label>'+radio('never','Nunca')+'</label>'+
      '<label>'+radio('date','El')+'<input type="date" name="repEndDate" aria-label="Fecha de fin de la serie" value="'+esc(r.endDate||'')+'"></label>'+
      '<label>'+radio('count','Después de')+'<input type="number" name="repCount" min="1" step="1" inputmode="numeric" aria-label="Número de repeticiones" value="'+(r.count||'')+'"> repeticiones</label>'+
    '</fieldset></div></fieldset>';
}
function bindRepeatForm(form){
  var F=form.elements,box=form.querySelector('#m-rep');
  F.repeat.addEventListener('change',function(){var v=F.repeat.value;
    form.querySelector('#m-rep-body').hidden=!v;form.querySelector('#m-rep-week').hidden=v!=='weekly';form.querySelector('#m-rep-month').hidden=v!=='monthly';
    form.querySelector('#m-rep-unit').textContent=REP_UNITS[v]||'';});
  box.addEventListener('click',function(e){var b=e.target.closest('.rep-day');if(b)b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));});
  /* Escribir en la fecha o en el número de fin elige esa opción */
  [['repEndDate','date'],['repCount','count']].forEach(function(p){F[p[0]].addEventListener('focus',function(){form.querySelector('input[name=repEnd][value='+p[1]+']').checked=true;});});
}
/* Lee el bloque: {repeat, rule} (rule saneada o null) o {error, el} con el mensaje y el campo a enfocar */
function readRepeatForm(form,oldRule){
  var F=form.elements,rep=F.repeat.value;
  if(!REPEATS.hasOwnProperty(rep))return {repeat:null,rule:null};
  var iv=F.repInterval.value.trim();
  if(!/^\d+$/.test(iv)||+iv<1)return {error:'«Se repite cada» debe ser un número entero mayor o igual a 1.',el:F.repInterval};
  var r={interval:+iv},st=F.repStart.value;
  if(rep==='weekly')r.weekdays=[].map.call(form.querySelectorAll('.rep-day[aria-pressed="true"]'),function(b){return +b.getAttribute('data-wd');});
  if(rep==='monthly'&&F.repMonthDay.value)r.monthDay=F.repMonthDay.value==='last'?'last':+F.repMonthDay.value;
  if(st&&!isYmd(st))return {error:'La fecha de inicio de la repetición no es válida.',el:F.repStart};
  /* Comienza solo se guarda si ya existía o si se cambió (las tareas antiguas no cambian al guardar) */
  if(st&&(F.repStart.getAttribute('data-had')==='1'||st!==F.repStart.defaultValue))r.start=st;
  var end=F.repEnd.value||'never';
  if(end==='date'){if(!isYmd(F.repEndDate.value))return {error:'Indica la fecha en que finaliza la repetición.',el:F.repEndDate};r.endType='date';r.endDate=F.repEndDate.value;}
  if(end==='count'){var c=F.repCount.value.trim();if(!/^\d+$/.test(c)||+c<1)return {error:'El número de repeticiones debe ser un entero mayor o igual a 1.',el:F.repCount};r.endType='count';r.count=+c;}
  if(oldRule&&oldRule.occurrence)r.occurrence=oldRule.occurrence;
  return {repeat:rep,rule:normRepeatRule(rep,r)};
}
function newLocalId(){return 'local-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
/* Subtareas en el modal: cada cambio se guarda al momento en localStorage (independiente de Guardar/Cancelar). */

  var list=subsOf(mother.id),d=list.filter(function(x){return !isOpen(x);}).length;
  document.getElementById('m-subs-count').textContent='☑ '+d+'/'+list.length;
  ul.innerHTML=list.length?list.map(function(x){
    return '<li class="sub-item'+(isOpen(x)?'':' done')+'" data-sub-id="'+esc(x.id)+'">'+
      '<input type="checkbox" class="chk" data-sub-act="toggle"'+(isOpen(x)?'':' checked')+' aria-label="Completar subtarea: '+esc(x.title)+'">'+
      '<input type="text" class="sub-title" data-sub-act="title" value="'+esc(x.title)+'" aria-label="Título de la subtarea">'+
      '<button type="button" class="btn" data-sub-act="edit" aria-label="Editar estado y seguimiento: '+esc(x.title)+'">Editar</button>'+
      '<button type="button" class="sub-del" data-sub-act="del" aria-label="Eliminar subtarea: '+esc(x.title)+'" title="Eliminar subtarea">×</button></li>';
  }).join(''):'<li class="sub-empty">Sin subtareas todavía.</li>';

function subsChanged(mother){var m=getTask(mother.id)||mother;touch(m);persist();render();renderSubs(m);}
function bindSubs(mother){
  var ul=document.getElementById('m-subs'),inp=document.getElementById('m-sub-new');
  renderSubs(mother);
  function subOf(el){var li=el.closest('[data-sub-id]');return li?getTask(li.getAttribute('data-sub-id')):null;}
  ul.addEventListener('change',function(e){
    var a=e.target.getAttribute('data-sub-act'),x=subOf(e.target);if(!x)return;
    if(a==='toggle'){setStatus(x,e.target.checked?'completed':'needsAction');subsChanged(mother);}
    else if(a==='title'){var v=e.target.value.trim();if(!v){e.target.value=x.title;return;}if(v!==x.title){x.title=v;touch(x);subsChanged(mother);}}
  });
  ul.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.getAttribute('data-sub-act')==='title'){e.preventDefault();e.target.blur();}});
  ul.addEventListener('click',function(e){
    var edit=e.target.closest('[data-sub-act="edit"]');if(edit){var sub=subOf(edit);if(sub)openModal(sub.id);return;}
    var b=e.target.closest('[data-sub-act="del"]');if(!b)return;var x=subOf(b);if(!x)return;
    if(!x.local&&!confirm('«'+x.title+'» viene de Google Tasks. ¿Eliminarla de este navegador?'))return;
    tombstone([x.id]);S.tasks=S.tasks.filter(function(y){return y.id!==x.id;});subsChanged(mother);inp.focus();
  });
  inp.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;e.preventDefault();
    var v=inp.value.trim();if(!v)return;
    S.tasks.push({id:newLocalId(),title:v,notes:'',start:null,due:null,fatal:null,priority:'Media',status:'needsAction',completed:null,
      listId:mother.listId,sourceListId:null,sourceList:null,parent:mother.id,webViewLink:null,links:[],
      position:'zzzz'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),hidden:false,updated:new Date().toISOString(),local:true});
    inp.value='';subsChanged(mother);inp.focus();
  });
}
function closeModal(){document.getElementById('modal-root').innerHTML='';if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus();}

/* ---------- Sincronización con GitHub (cambio 7) ---------- */
var GHKEY='tasks-web-v1:gh', SYNCKEY='tasks-web-v1:sync';
var GH_DEF_REPO='', GH_DEF_PATH='data/tasks.json';
var GH={sha:null,busy:false,again:false,timer:null,ver:0};
/* Config {token,repo,path}. El token vive SOLO aquí: nunca en S, export, consola, DOM ni mensajes. */
function ghCfg(){
  var c={};try{c=JSON.parse(localStorage.getItem(GHKEY)||'{}')||{};}catch(e){c={};}
  return {token:typeof c.token==='string'?c.token:'',repo:typeof c.repo==='string'&&c.repo?c.repo:GH_DEF_REPO,path:typeof c.path==='string'&&c.path?c.path:GH_DEF_PATH};
}
function ghSaveCfg(c){localStorage.setItem(GHKEY,JSON.stringify({token:c.token||'',repo:c.repo,path:c.path}));}
function ghOn(){return !!ghCfg().token;}
function syncMeta(){try{return JSON.parse(localStorage.getItem(SYNCKEY)||'{}')||{};}catch(e){return {};}}
function setSyncMeta(m){try{localStorage.setItem(SYNCKEY,JSON.stringify(m));}catch(e){}}
function markDirty(){GH.ver++;var m=syncMeta();m.dirty=true;setSyncMeta(m);}
function isDirty(){return !!syncMeta().dirty;}
/* Quita el token de cualquier texto (defensa extra para mensajes de error) */
function scrub(s){s=String(s==null?'':s);var tk=ghCfg().token;if(tk)s=s.split(tk).join('***');return s.replace(/(gh[pousr]_|github_pat_)[A-Za-z0-9_]+/g,'***');}
function setSaved(kind,msg){
  var box=document.getElementById('saved'),txt=document.getElementById('saved-text');
  box.classList.toggle('error',kind==='error');box.classList.toggle('syncing',kind==='sync');
  if(kind==='local')txt.textContent='Guardado localmente · '+hhmm();
  else if(kind==='synced')txt.textContent='Sincronizado con GitHub · '+hhmm();
  else if(kind==='sync')txt.textContent='Sincronizando…';
  else if(kind==='error')txt.textContent='Error GitHub: '+scrub(msg);
  else txt.textContent='Guardado localmente';
}
function renderGh(){
  var on=ghOn(),b=document.getElementById('btn-github');
  b.textContent=on?'⇅ GitHub: conectado':'⇅ Conectar a GitHub';b.classList.toggle('gh-on',on);
  document.getElementById('gh-reload').hidden=!on;
  document.getElementById('side-notice').innerHTML=on?'Los cambios se guardan en este navegador y en GitHub (<strong>'+esc(ghCfg().repo)+'</strong>). <strong>No se sincronizan con Google Tasks</strong>.':'Los cambios se guardan solo en este navegador y <strong>no se sincronizan con Google Tasks</strong>.';
}
/* base64 <-> UTF-8 correcto (tildes, ñ, emojis) */
function b64enc(str){var by=new TextEncoder().encode(str),bin='',CH=0x8000;for(var i=0;i<by.length;i+=CH)bin+=String.fromCharCode.apply(null,by.subarray(i,i+CH));return btoa(bin);}
function b64dec(b64){var bin=atob(String(b64||'').replace(/\s/g,'')),by=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(by);}
function ghErr(status,message){var e=new Error(message);e.status=status;return e;}
function ghMsg(status,body){
  var m=String(body&&body.message||'');
  if(status===401)return 'token inválido o expirado. Vuelve a conectar con un token válido.';
  if(status===403)return /rate limit/i.test(m)?'límite de solicitudes de GitHub alcanzado; intenta más tarde.':'sin permiso. El token necesita acceso "Contents: lectura y escritura" a este repositorio.';
  if(status===404)return 'repositorio o archivo no encontrado (revisa repo, ruta y que el token tenga acceso).';
  return 'respuesta inesperada de GitHub ('+status+')'+(m?': '+scrub(m).slice(0,120):'');
}
function ghUrl(c,sub){return 'https://api.github.com/repos/'+c.repo.split('/').map(encodeURIComponent).join('/')+sub;}
function ghPathUrl(c){return ghUrl(c,'/contents/'+c.path.split('/').map(encodeURIComponent).join('/'));}
async function ghFetch(url,opt){
  var c=ghCfg();opt=opt||{};
  var h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token};
  if(opt.body)h['Content-Type']='application/json';
  var r;
  try{r=await fetch(url,{method:opt.method||'GET',headers:h,body:opt.body,cache:'no-store'});}
  catch(e){throw ghErr(0,'sin conexión con GitHub.');}
  var body=null;try{body=await r.json();}catch(e){}
  return {status:r.status,ok:r.ok,body:body};
}
function isShaConflict(r){return r.status===409||(r.status===422&&/sha/i.test(String(r.body&&r.body.message||'')));}
/* GET del archivo: {doc, sha}. Si pesa >1 MB, el contenido llega vacío y se lee el blob. */
async function ghGet(){
  var c=ghCfg(),r=await ghFetch(ghPathUrl(c));
  if(!r.ok)throw ghErr(r.status,ghMsg(r.status,r.body));
  var b=r.body||{},content=b.content;
  if(!content&&b.sha){var rb=await ghFetch(ghUrl(c,'/git/blobs/'+encodeURIComponent(b.sha)));if(!rb.ok)throw ghErr(rb.status,ghMsg(rb.status,rb.body));content=rb.body.content;}
  var doc;try{doc=JSON.parse(b64dec(content));}catch(e){throw ghErr(0,'el archivo remoto no es JSON válido.');}
  return {doc:doc,sha:b.sha};
}
function docFromState(){
  return {schemaVersion:4,migrations:S.migrations||{projects4:true,splitDJ5:true},updatedAt:new Date().toISOString(),updatedBy:'app',
    lists:S.lists,tasks:S.tasks,deleted:S.deleted||{}};
}
async function ghPut(sha){
  var c=ghCfg(),body={message:'app: actualiza tareas ('+S.tasks.length+')',content:b64enc(JSON.stringify(docFromState(),null,2)+'\n')};
  if(sha)body.sha=sha;
  return ghFetch(ghPathUrl(c),{method:'PUT',body:JSON.stringify(body)});
}
function isSeedDoc(d){return !d||d.seed===true||(Array.isArray(d.tasks)&&!d.tasks.length&&!d.migrations);}
function tsOf(s){var n=Date.parse(s||'');return isNaN(n)?0:n;}
/* Merge por id: gana el `updated` más reciente; tareas de un solo lado se conservan salvo lápida
   más nueva; unión de lápidas (la más reciente por id). Orden: local y luego las nuevas remotas. */
function mergeDocs(local,remote){
  var del={},k;
  [local.deleted||{},remote.deleted||{}].forEach(function(d){for(k in d)if(!del[k]||tsOf(d[k])>tsOf(del[k]))del[k]=d[k];});
  var R={},L={};(remote.tasks||[]).forEach(function(t){if(t&&t.id)R[t.id]=t;});(local.tasks||[]).forEach(function(t){if(t&&t.id)L[t.id]=t;});
  var out=[];
  function keep(t){return !(del[t.id]&&tsOf(del[t.id])>=tsOf(t.updated));}
  (local.tasks||[]).forEach(function(t){if(!t||!t.id)return;var r=R[t.id],w=r&&tsOf(r.updated)>tsOf(t.updated)?r:t;if(keep(w))out.push(w);});
  (remote.tasks||[]).forEach(function(t){if(t&&t.id&&!L[t.id]&&keep(t))out.push(t);});
  var mig={};[remote.migrations||{},local.migrations||{}].forEach(function(m){for(k in m)mig[k]=mig[k]||m[k];});
  return {schemaVersion:4,migrations:mig,lists:local.lists||remote.lists,tasks:out,deleted:del};
}
function applyState(raw){S=normalize(raw,!isMigrated(raw));writeLocal();render();}
/* Sube S con el sha actual. En conflicto (409/422-sha): relee, mezcla, re-renderiza y reintenta (máx 3). */
async function pushFlow(){
  for(var attempt=0;attempt<=3;attempt++){
    if(!GH.sha){var g=await ghGet();GH.sha=g.sha;if(!isSeedDoc(g.doc))applyState(mergeDocs(S,g.doc));}
    var ver=GH.ver,r=await ghPut(GH.sha);
    if(r.ok){GH.sha=r.body&&r.body.content&&r.body.content.sha||null;if(ver===GH.ver){var m=syncMeta();m.dirty=false;m.lastSync=new Date().toISOString();setSyncMeta(m);}return;}
    if(!isShaConflict(r))throw ghErr(r.status,ghMsg(r.status,r.body));
    var g2=await ghGet();GH.sha=g2.sha;
    if(!isSeedDoc(g2.doc)){applyState(mergeDocs(S,g2.doc));toast('Se combinaron cambios hechos en GitHub');}
  }
  throw ghErr(409,'conflicto persistente al guardar; usa "Recargar desde GitHub".');
}
/* Serializa las operaciones de red: nunca hay dos PUT simultáneos. */
function runSync(fn){
  if(GH.busy){GH.again=true;return Promise.resolve();}
  GH.busy=true;setSaved('sync');
  return fn().then(function(){setSaved('synced');},function(e){setSaved('error',e&&e.message||'error desconocido');})
    .then(function(){GH.busy=false;if(GH.again&&ghOn()){GH.again=false;if(isDirty())return runSync(pushFlow);}});
}
function schedulePush(){clearTimeout(GH.timer);setSaved('sync');GH.timer=setTimeout(function(){GH.timer=null;runSync(pushFlow);},1500);}
/* Carga desde GitHub: semilla => sube lo local; remoto real => fuente de verdad (mezcla si hay cambios locales sin subir). */
async function pullFlow(){
  var g=await ghGet();GH.sha=g.sha;
  if(isSeedDoc(g.doc)){markDirty();return pushFlow();}
  if(isDirty()){applyState(mergeDocs(S,g.doc));return pushFlow();}
  applyState(g.doc);var m=syncMeta();m.dirty=false;m.lastSync=new Date().toISOString();setSyncMeta(m);
}
function ghPull(){if(!ghOn())return Promise.resolve();clearTimeout(GH.timer);GH.timer=null;return runSync(pullFlow);}

function openGhModal(){
  var c=ghCfg(),on=!!c.token,root=document.getElementById('modal-root');
  lastFocus=document.activeElement;
  root.innerHTML='<div class="backdrop" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="gh-h">'+
   '<header><h2 id="gh-h">Conectar a GitHub</h2><button type="button" class="icon-btn" data-close="1" aria-label="Cerrar">✕</button></header>'+
   '<form id="gh-form" novalidate>'+
   '<p class="form-note" style="margin:0">Las tareas se guardan como JSON en un repositorio privado para compartirlas con los bots. '+(on?'<strong>Conectado.</strong> Deja el token vacío para mantener el actual.':'Usa un token <em>fine-grained</em> con permiso "Contents: lectura y escritura" solo en ese repo.')+'</p>'+
   '<label class="field full">Token de GitHub<input type="password" name="token" id="gh-token" autocomplete="off" spellcheck="false" placeholder="'+(on?'•••••••• (guardado)':'github_pat_…')+'"></label>'+
   '<label class="field">Repositorio<input name="repo" id="gh-repo" autocomplete="off" placeholder="dueño/repositorio" value="'+esc(c.repo)+'"></label>'+
   '<label class="field">Ruta del archivo<input name="path" id="gh-path" autocomplete="off" value="'+esc(c.path)+'"></label>'+
   '<div class="form-note">El token queda guardado solo en este navegador (localStorage) y no se incluye en Exportar JSON.</div>'+
   '<div class="err" id="gh-err" role="alert"></div>'+
   '<div class="actions">'+(on?'<button type="button" class="btn" style="color:var(--red)" id="gh-disconnect">Desconectar</button><button type="button" class="btn" id="gh-modal-reload">⟳ Recargar desde GitHub</button>':'')+
   '<span class="grow"></span><button type="button" class="btn" data-close="1">Cancelar</button><button type="submit" class="btn btn-primary" id="gh-connect">Conectar</button></div>'+
   '</form></div></div>';
  var form=document.getElementById('gh-form'),F=form.elements;
  F.token.focus();
  root.querySelector('.backdrop').addEventListener('click',function(e){if(e.target.getAttribute('data-close'))closeModal();});
  root.querySelector('.modal').addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();closeModal();}});
  var dc=document.getElementById('gh-disconnect');
  if(dc)dc.addEventListener('click',function(){var k=ghCfg();k.token='';ghSaveCfg(k);GH.sha=null;clearTimeout(GH.timer);setSyncMeta({});closeModal();renderGh();setSaved('idle');toast('Desconectado de GitHub; los datos quedan en este navegador');});
  var rl=document.getElementById('gh-modal-reload');
  if(rl)rl.addEventListener('click',function(){closeModal();ghPull();});
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var tk=F.token.value.trim(),repo=F.repo.value.trim(),path=F.path.value.trim().replace(/^\/+/,''),err=document.getElementById('gh-err');
    F.token.value='';
    if(!tk&&!on){err.textContent='Ingresa el token.';F.token.focus();return;}
    if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)){err.textContent='Repositorio inválido (formato dueño/nombre).';return;}
    if(!/^[^\s]+\.json$/i.test(path)||path.split('/').indexOf('..')>=0){err.textContent='Ruta inválida (ej. data/tasks.json).';return;}
    var prev=ghCfg(),changed=prev.repo!==repo||prev.path!==path;
    ghSaveCfg({token:tk||prev.token,repo:repo,path:path});tk='';
    if(changed||!on){GH.sha=null;var m=syncMeta();m.dirty=false;setSyncMeta(m);}
    closeModal();renderGh();ghPull();
  });
}

window.TasksApp={getTask:function(id){var t=getTask(id);return t?JSON.parse(JSON.stringify(t)):null;},count:function(){return S.tasks.length;},
  mainCount:function(){return mains().length;},isSub:function(id){return isSub(getTask(id));},subsOf:function(id){return JSON.parse(JSON.stringify(subsOf(id)));},
  gmailLinkOf:gmailLinkOf,legacyGmailToAuthuser:legacyGmailToAuthuser,isAllowedGmailUrl:isAllowedGmailUrl,safeHttpsUrl:safeHttpsUrl,classifyProject:classifyProject,classifyExplain:classifyExplain,projects:function(){return JSON.parse(JSON.stringify(PROJECTS));},
  seed:function(){return JSON.parse(JSON.stringify(SEED));},openTask:function(id){openModal(id);},today:T,state:function(){return JSON.parse(JSON.stringify(S));},
  mergeDocs:function(a,b){return JSON.parse(JSON.stringify(mergeDocs(a,b)));},syncIdle:function(){return !GH.busy&&!GH.timer;},dirty:isDirty,
  isActionToday:isActionToday,nextDue:nextDue,todaySantiago:todaySantiago,
  nextOccurrence:nextOccurrence,repeatSummary:repeatSummary,normRepeatRule:normRepeatRule};

load();UI=loadUI();
document.getElementById('f-sort').value=UI.sort;
render();renderGh();
/* Con token: se muestra la caché local al instante y luego se trae GitHub */
if(ghOn())ghPull();
})();
</script>
